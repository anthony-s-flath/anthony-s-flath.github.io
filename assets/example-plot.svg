<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Example line graph</title>
  <desc id="desc">A simple line increasing across four points.</desc>
  <rect width="640" height="300" fill="white"/>
  <g stroke="#777" stroke-width="1">
    <line x1="70" y1="240" x2="600" y2="240"/>
    <line x1="70" y1="35" x2="70" y2="240"/>
  </g>
  <g fill="#444" font-family="sans-serif" font-size="14">
    <text x="60" y="265">1</text>
    <text x="225" y="265">2</text>
    <text x="390" y="265">3</text>
    <text x="555" y="265">4</text>
    <text x="18" y="244">0</text>
    <text x="18" y="177">1</text>
    <text x="18" y="110">2</text>
    <text x="18" y="43">3</text>
  </g>
  <polyline points="70,220 235,185 400,120 565,55" fill="none" stroke="#222" stroke-width="3"/>
  <g fill="#222">
    <circle cx="70" cy="220" r="5"/>
    <circle cx="235" cy="185" r="5"/>
    <circle cx="400" cy="120" r="5"/>
    <circle cx="565" cy="55" r="5"/>
  </g>
</svg>
